<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel - Aaraamalae</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="canvas-container"></div>

<header>
  <div class="logo">Aaraamalae Admin</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="kitchen.html">Kitchen</a>
    <a href="admin.html">Admin</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main class="container">
  <section id="admin-login-section">
    <h2>Admin Login</h2>
    <form id="admin-login-form">
      <input type="email" id="admin-email" placeholder="Email" required />
      <input type="password" id="admin-password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p id="admin-login-error" style="color: #f55; margin-top:10px;"></p>
    </form>
  </section>

  <section id="admin-panel" style="display:none;">
    <h2>Manage Menu Items</h2>
    <form id="add-menu-form">
      <input type="text" id="menu-name" placeholder="Name" required />
      <input type="text" id="menu-desc" placeholder="Description" required />
      <input type="number" id="menu-price" placeholder="Price (₹)" required />
      <input type="text" id="menu-img" placeholder="Image filename (e.g. filter-coffee.jpg)" required />
      <button type="submit">Add Menu Item</button>
    </form>

    <ul id="menu-items-list"></ul>

    <h2>Customer Reviews</h2>
    <ul id="reviews-list"></ul>

    <button id="admin-logout-btn">Logout</button>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="main.js"></script>
<script src="firebase.js"></script>
<script src="admin.js"></script>

</body>
</html>
